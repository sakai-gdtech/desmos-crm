<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desmos — dourado no sistema</title>
<style>body{margin:0;padding:28px;font:15px/1.5 system-ui;background:#f8f7f4;color:#202d40}main{max-width:1600px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#5d6b7e;margin:0 0 18px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,a{font:inherit}button{padding:8px 12px;border:1px solid #e4e3de;border-radius:6px;background:white;color:#202d40;cursor:pointer}button[aria-pressed=true]{background:#f6f0e4;border-color:#aa8446;font-weight:600}button:focus-visible,a:focus-visible{outline:2px solid #3067a9;outline-offset:3px}a{color:#173b68}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:8px 0}img{width:100%;display:block;border:1px solid #e4e3de;border-radius:8px;background:white}.mobile img{max-width:390px}footer{margin-top:20px}@media(max-width:760px){body{padding:16px}.comparison{grid-template-columns:1fr}}</style>
<main><h1>Dourado no sistema Desmos</h1><p>Comparação das telas reais, com fixtures fictícias. Azul para ação e foco; ouro fosco para orientação e marca. Sem alterações de layout.</p>
<nav aria-label="Viewport e tema" id="variants"></nav><nav aria-label="Tela" id="screens"></nav>
<div class="comparison" id="comparison"><figure><figcaption>Antes</figcaption><a id="before-link"><img id="before" alt="Tela antes do refinamento dourado"></a></figure><figure><figcaption>Depois</figcaption><a id="after-link"><img id="after" alt="Tela depois do refinamento dourado"></a></figure></div>
<footer><a href="validation.md">Validação e limites</a> · <a href="contrast.json">Contraste medido</a> · <a href="bundle.json">Método de bundle</a> · <a href="provenance.json">Proveniência</a></footer></main>
<script>
let variant='desktop-light',screen='dashboard';
const variants=[['desktop-light','Desktop claro'],['desktop-dark','Desktop escuro'],['mobile-light','Mobile claro'],['mobile-dark','Mobile escuro']];
const screens=[['dashboard','Visão geral / Radar'],['board','Negócios'],['agenda','Agenda'],['automations','Automações'],['automation-editor','Editor de automação'],['form','Formulário'],['pipeline','Editor de funil'],['select','Select aberto'],['navigation','Navegação'],['assistant','Assistente']];
function render(){document.querySelector('#comparison').classList.toggle('mobile',variant.startsWith('mobile'));for(const phase of ['before','after']){const src=phase+'-'+variant+'-'+screen+'.png';document.querySelector('#'+phase).src=src;document.querySelector('#'+phase+'-link').href=src;}for(const b of document.querySelectorAll('#variants button'))b.setAttribute('aria-pressed',String(b.dataset.value===variant));for(const b of document.querySelectorAll('#screens button'))b.setAttribute('aria-pressed',String(b.dataset.value===screen));}
for(const [id,items] of [['variants',variants],['screens',screens]]){for(const [value,label] of items){const b=document.createElement('button');b.type='button';b.dataset.value=value;b.textContent=label;b.onclick=()=>{if(id==='variants')variant=value;else screen=value;render();};document.querySelector('#'+id).append(b);}}render();
</script></html>
